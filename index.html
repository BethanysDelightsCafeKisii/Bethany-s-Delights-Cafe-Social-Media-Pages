<!DOCTYPE html>
<html>
<head>
  <title>Bethany's Delights Socials</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding-top: 30px;
      background: #f5f5f5;
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 10px;
      background: #ddd; /* placeholder background */
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 12px;
    }

    h2 {
      margin-top: 10px;
    }

    a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 15px auto;
      padding: 15px;
      background: #333;
      color: white;
      text-decoration: none;
      width: 260px;
      border-radius: 10px;
      transition: 0.3s;
    }

    a:hover {
      background: #555;
      transform: scale(1.03);
    }

    svg {
      width: 22px;
      height: 22px;
      fill: white;
    }
  </style>
</head>

<body>

<!-- HEADER LOGO PLACEHOLDER -->
<div class="header">
  <img src="logo.png" alt="Bethany's Delights Logo" class="logo">
  <h2>Bethany's Delights</h2>
